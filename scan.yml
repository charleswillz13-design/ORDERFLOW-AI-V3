name: scan
on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub may delay scheduled runs by several minutes
  workflow_dispatch: {}
concurrency:
  group: scan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Load saved state
        run: |
          mkdir -p data
          if git fetch origin data --depth=1 2>/dev/null; then git show origin/data:state.json > data/state.json 2>/dev/null || echo '{}' > data/state.json; else echo '{}' > data/state.json; fi
      - name: Scan
        run: node scan.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          METAAPI_ACCOUNT_ID: ${{ secrets.METAAPI_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAUSED: ${{ vars.PAUSED }}
          EXECUTE: ${{ vars.EXECUTE }}
          HL_COIN: ${{ vars.HL_COIN }}
          SYMBOL: ${{ vars.SYMBOL }}
          TF: ${{ vars.TF }}
          RISK_MODE: ${{ vars.RISK_MODE }}
          RISK_VALUE: ${{ vars.RISK_VALUE }}
          MAX_LOT: ${{ vars.MAX_LOT }}
          MIN_CONF: ${{ vars.MIN_CONF }}
          MAX_TRADES_PER_DAY: ${{ vars.MAX_TRADES_PER_DAY }}
          COOLDOWN_MIN: ${{ vars.COOLDOWN_MIN }}
          CONTRACT_OZ: ${{ vars.CONTRACT_OZ }}
          METAAPI_URL: ${{ vars.METAAPI_URL }}
          NEWS_FILTER: ${{ vars.NEWS_FILTER }}
          NEWS_CCY: ${{ vars.NEWS_CCY }}
          NEWS_WINDOW_MIN: ${{ vars.NEWS_WINDOW_MIN }}
      - name: Publish data branch (no history kept)
        if: always()
        run: |
          cd data
          git init -q -b data
          git config user.name "scanner"; git config user.email "scanner@users.noreply.github.com"
          git add -A; git commit -qm "scan $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
